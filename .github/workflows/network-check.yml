name: Network diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/network-check.yml', 'Tests/**', 'scripts/test-network.sh', 'AADRIPro/Network.swift']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-network.sh
